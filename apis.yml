description: Analytical Flavor Systems is the startup behind Gastrograph AI, a sensory-science and machine-learning
  platform that modeled human flavor, aroma, and texture perception to help food and beverage companies predict
  consumer preference, benchmark products, and optimize formulations before physical prototyping. It was a
  Techstars-backed portfolio company. Its gastrograph.com domain now 301-redirects to NielsenIQ, which acquired
  the technology and folded it into its BASES AI Product Developer solution; no independent public API, developer
  portal, or SDK surface remains.
